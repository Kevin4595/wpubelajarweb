<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Galau</title>
  <style>
    body {
      font-family: "Courier New", Courier, monospace;
      font-weight: bold;
      color: rgb(1, 1, 1);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(151, 151, 151);
      text-shadow: 5px 5px 0 rgb(215, 215, 215);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: rgb(151, 151, 151);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h1>Hujan Sendiri</h1>

  <p class="quote">"Sudah lama kubilang aku <span>tak apa-apa</span>. <br>
    Hanya senyum yang pandai bersandiwara. <br>
    Malam ini, bolehkah aku jujur pada sunyi? <br>
    Sebelum pagi memintaku berpura-pura lagi."</p>

  <p class="credit"> - nara senja feat. hujan sore -</p>
</body>
</html>
