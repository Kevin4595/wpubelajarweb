<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: black;
            background-image: linear-gradient(to right, red 40%, blue, white, yellow);
            height: 100vh;
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: green;
            background-image: linear-gradient(to bottom, lightblue, lightgreen, salmon);
        }

        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: green;
            background-image: radial-gradient(red, blue);
        }

        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: red;
            background-image: conic-gradient(green, white, yellow);
        }
    </style>
</head>

<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>

</html>
